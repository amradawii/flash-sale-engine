x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: flash-sale-engine/php:dev
  volumes:
    - ./:/var/www/html
    # vendor lives inside Linux: reading it through a Windows/macOS bind mount
    # adds seconds to every request.
    - vendor:/var/www/html/vendor
  restart: unless-stopped

services:
  app:
    <<: *php
    command: ["sh", "docker/php/entrypoint.sh", "php-fpm"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 3s
      retries: 60

  nginx:
    image: nginx:1.27.0-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8081:8080"
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  consumer:
    <<: *php
    command: ["php", "artisan", "flash-sale:consume-orders"]
    stop_signal: SIGTERM
    depends_on:
      app:
        condition: service_healthy

  node:
    image: node:20.16.0-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run build"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: "no"

  mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_DATABASE: flash_sale
      MYSQL_USER: flash_sale
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      retries: 40
    restart: unless-stopped

  redis:
    image: redis:7.2.5-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

volumes:
  vendor:
  mysql_data:
  redis_data:
  node_modules:
